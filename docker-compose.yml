services:
  # --- Backend Service ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3001
      - API_IP=0.0.0.0
      - API_PORT=${API_PORT}
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DB=${MONGODB_DB}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - LLAMA_ENDPOINT=${LLAMA_ENDPOINT}
      - THINKER_MODEL=${THINKER_MODEL}
      - REFLEX_MODEL=${REFLEX_MODEL}
      - LLM_TIMEOUT=${LLM_TIMEOUT}
      - HONCHO_API_KEY=${HONCHO_API_KEY}
      - HONCHO_API_URL=${HONCHO_API_URL}
      - API_SECRET_KEY=${API_SECRET_KEY}
    volumes:
      - ./backend/src:/app/src # Optional: for development hot reloading if needed, but usually not in prod

  # --- Frontend Service ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    restart: unless-stopped
    ports:
      - "8111:8111"
      - "8112:8112"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - backend
